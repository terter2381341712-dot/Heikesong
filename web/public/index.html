<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="校园算力网识别工作台，提交识别任务、查询进度、预览结果和查看设备资源。" data-en-content="Edge Fabric recognition workbench for submitting jobs, checking progress, previewing results, and viewing devices.">
  <title data-en="Edge Fabric · Campus Compute">校园算力网 · Edge Fabric</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/workflow.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#workflow-graph" data-en="Skip to recognition tools">跳到识别入口</a>
  <main class="content">
    <p id="startup-error" class="notice error" role="alert" hidden></p>
    <section id="workflow-graph" class="workflow" aria-labelledby="workflow-brand" tabindex="-1">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <div><h1 id="workflow-brand">Edge Fabric</h1><small data-en="Campus Compute">校园算力网</small></div>
        </div>
        <div class="topbar-actions">
          <span id="environment" class="environment" hidden></span>
          <button id="open-settings" class="button subtle" type="button" aria-haspopup="dialog" hidden><span data-icon="settings"></span><span data-en="Settings">设置</span></button>
        </div>
      </header>
      <div class="workflow-stage">
        <div class="workflow-map">
          <div class="workflow-art" aria-hidden="true">
            <picture class="workflow-poster">
              <source media="(max-width: 770px)" srcset="/assets/ether-node-small.webp" type="image/webp">
              <img src="/assets/ether-node.png" width="1440" height="810" fetchpriority="high" alt="">
            </picture>
            <video id="workflow-video" data-src="/assets/ether-node.mp4" width="1280" height="720" muted loop playsinline preload="none" aria-hidden="true"></video>
            <div class="workflow-atmosphere" aria-hidden="true"></div>
            <svg class="workflow-branches" viewBox="0 0 1280 720" width="1280" height="720" focusable="false">
              <defs>
                <path id="thread-upload" pathLength="100" d="M267 208 C323 241 404 273 492 288"></path>
                <path id="thread-progress" pathLength="100" d="M492 362 C415 365 353 399 303 440"></path>
                <path id="thread-results" pathLength="100" d="M789 255 C850 204 927 191 983 191"></path>
                <path id="thread-resources" pathLength="100" d="M787 378 C864 415 954 424 1024 422"></path>
              </defs>
              <g class="workflow-branch branch-upload">
                <use class="workflow-thread" href="#thread-upload"></use>
                <use class="workflow-current" href="#thread-upload"></use>
              </g>
              <g class="workflow-branch branch-progress">
                <use class="workflow-thread" href="#thread-progress"></use>
                <use class="workflow-current" href="#thread-progress"></use>
              </g>
              <g class="workflow-branch branch-results">
                <use class="workflow-thread" href="#thread-results"></use>
                <use class="workflow-current" href="#thread-results"></use>
              </g>
              <g class="workflow-branch branch-resources">
                <use class="workflow-thread" href="#thread-resources"></use>
                <use class="workflow-current" href="#thread-resources"></use>
              </g>
            </svg>
          </div>
          <nav class="workflow-nodes" aria-label="流程入口" data-en-label="Recognition tools">
            <a class="workflow-node branch-upload" href="#submit/upload" data-workflow-node="upload" aria-haspopup="dialog" aria-controls="workflow-dialog">
              <span class="workflow-node-icon" data-icon="upload" aria-hidden="true"></span>
              <canvas class="workflow-node-orb" width="160" height="160" aria-hidden="true"></canvas>
              <span class="workflow-node-name" data-en="Upload images">上传图片</span>
            </a>
            <a class="workflow-node branch-progress" href="#jobs" data-workflow-node="progress" aria-haspopup="dialog" aria-controls="workflow-dialog">
              <span class="workflow-node-icon" data-icon="jobs" aria-hidden="true"></span>
              <canvas class="workflow-node-orb" width="160" height="160" aria-hidden="true"></canvas>
              <span class="workflow-node-name" data-en="Job progress">任务进度</span>
            </a>
            <a class="workflow-node branch-results" href="#jobs/results" data-workflow-node="results" aria-haspopup="dialog" aria-controls="workflow-dialog">
              <span class="workflow-node-icon" data-icon="download" aria-hidden="true"></span>
              <canvas class="workflow-node-orb" width="160" height="160" aria-hidden="true"></canvas>
              <span class="workflow-node-name" data-en="Results">识别结果</span>
            </a>
            <a class="workflow-node branch-resources" href="#resources" data-workflow-node="resources" aria-haspopup="dialog" aria-controls="workflow-dialog">
              <span class="workflow-node-icon" data-icon="devices" aria-hidden="true"></span>
              <canvas class="workflow-node-orb" width="160" height="160" aria-hidden="true"></canvas>
              <span class="workflow-node-name" data-en="Devices">设备资源</span>
            </a>
          </nav>
        </div>
      </div>
      <footer class="service-status" aria-label="服务连接" data-en-label="Service connections">
        <div><span data-en="P1 Resource service">P1 资源服务</span><span id="p1-connection" class="connection">待连接</span></div>
        <div><span data-en="P2 Task service">P2 任务服务</span><span id="p2-connection" class="connection">待连接</span></div>
      </footer>
    </section>
  </main>

  <dialog id="workflow-dialog" class="panel workflow-dialog" aria-labelledby="workflow-title">
    <header class="workflow-dialog-header">
      <h2 id="workflow-title" tabindex="-1" autofocus></h2>
      <div class="workflow-dialog-actions">
        <button id="workflow-settings" class="button subtle" type="button" aria-haspopup="dialog" hidden data-en="Connection settings">连接设置</button>
        <button id="close-workflow" class="icon-button" type="button" aria-label="关闭窗口" data-en-label="Close window"><span data-icon="close"></span></button>
      </div>
    </header>
    <div id="workflow-body" class="workflow-dialog-body">
      <div id="view-upload" hidden>
        <form id="submit-form" aria-label="提交识别任务" data-en-label="Submit a recognition job">
          <fieldset class="form-section">
            <legend data-en="Task type">任务类型</legend>
            <div id="type-options" class="type-options"><p class="muted" data-en="Loading task types…">正在读取任务类型…</p></div>
            <p id="catalog-error" class="notice error" role="status" hidden></p>
          </fieldset>
          <div class="form-section">
            <label for="language" class="field-title" data-en="Recognition language">识别语言</label>
            <select id="language" disabled></select>
          </div>
          <div class="form-section">
            <label for="files" class="field-title" data-en="Input files">输入文件</label>
            <div id="dropzone" class="dropzone" aria-disabled="true">
              <span class="drop-icon" data-icon="upload"></span>
              <input id="files" type="file" multiple hidden disabled>
              <button id="choose-files" type="button" class="button secondary" disabled data-en="Choose files">选择文件</button>
              <span class="drop-hint" data-en="or drop files here">或拖放文件到这里</span>
              <button id="use-samples" type="button" class="button subtle" hidden data-en="Use sample files">使用演示文件</button>
              <p id="file-limits" class="field-hint">请先选择已配置的任务类型。</p>
            </div>
            <ul id="file-list" class="file-list" aria-label="已选文件" data-en-label="Selected files" hidden></ul>
            <p id="form-error" class="notice error" role="alert" hidden></p>
          </div>
          <div class="form-footer">
            <p id="submit-note" class="muted" role="status"></p>
            <button id="discard-pending" class="button subtle" type="button" hidden data-en="Choose new files">重新选文件</button>
            <button id="submit-button" class="button primary" type="submit" disabled><span id="submit-label">提交任务</span><span data-icon="arrow"></span></button>
          </div>
        </form>
      </div>
      <div id="view-jobs" class="job-layout" hidden>
        <section class="panel compact" aria-labelledby="job-history-title">
          <div class="panel-heading"><h3 id="job-history-title" data-en="Job history">任务批次</h3></div>
          <div id="job-history"></div>
          <form id="lookup-form" class="lookup-form">
            <label for="lookup-id" class="field-title" data-en="Find by Job ID">按 Job ID 查询</label>
            <div><input id="lookup-id" name="job-id" type="text" autocomplete="off" spellcheck="false" required><button class="button secondary" type="submit" data-en="Find">查询</button></div>
            <p id="lookup-error" class="field-hint error-text" role="alert" hidden></p>
          </form>
        </section>
        <div id="job-detail" role="region" tabindex="-1" aria-label="任务详情" data-en-label="Job details"></div>
      </div>
      <div id="view-resources" hidden>
        <div class="resource-heading">
          <p id="resource-counts" hidden></p>
        </div>
        <div id="resource-alert"></div>
        <div id="resource-empty"></div>
        <div id="resource-layout" class="resource-layout" hidden>
          <div id="resource-grid" class="resource-grid"></div>
          <div id="resource-inspector" class="resource-inspector">
            <p id="resource-instruction" class="resource-instruction" data-en="Hover to preview. Click a device to pin or hide its details.">悬停预览，点击设备可固定或收起详情。</p>
            <div id="resource-detail" hidden></div>
          </div>
        </div>
      </div>
    </div>
    <div id="workflow-toast" class="toast" role="status" hidden></div>
  </dialog>

  <dialog id="settings-dialog" class="panel dialog" aria-labelledby="dialog-title">
    <form id="settings-form">
      <div class="panel-heading"><h2 id="dialog-title" data-en="Workbench settings">工作台设置</h2><button type="button" id="close-settings" class="icon-button" aria-label="关闭设置" data-en-label="Close settings"><span data-icon="close"></span></button></div>
      <div class="language-settings">
        <label for="ui-language" data-en="Interface language">界面语言</label>
        <select id="ui-language">
          <option value="zh-CN" lang="zh-CN">简体中文</option>
          <option value="en" lang="en">English</option>
        </select>
      </div>
      <div class="motion-settings">
        <label for="workflow-playback" data-en="Play homepage animations">播放首页动效</label>
        <input id="workflow-playback" type="checkbox" role="switch" aria-describedby="motion-preference">
        <p id="motion-preference" class="field-hint" hidden data-en="Reduced motion is enabled on this device.">系统已开启减少动态效果。</p>
      </div>
      <div class="weather-settings">
        <label for="scene-weather" data-en="Background weather">背景天气</label>
        <select id="scene-weather">
          <option value="clear" data-en="Clear">晴朗</option>
          <option value="mist" data-en="Light mist" selected>薄雾</option>
          <option value="overcast" data-en="Overcast">阴云</option>
        </select>
      </div>
      <div id="mock-settings" class="dialog-fields" hidden>
        <label for="scenario" class="field-title" data-en="Demo scenario">模拟场景</label>
        <select id="scenario">
          <option value="success" data-en="Normal operation">正常识别（可接单）</option>
          <option value="no-resources" data-en="No available devices">无可用设备</option>
          <option value="preparing" data-en="Model preparing">模型准备中</option>
          <option value="partial-failure" data-en="Partial failure (at least two files)">部分失败（同批至少两个文件）</option>
          <option value="p1-offline" data-en="P1 offline">P1 连接断开</option>
          <option value="p2-offline" data-en="P2 offline">P2 连接断开</option>
          <option value="unconfigured" data-en="Task type not configured">类型未配置</option>
        </select>
        <p class="field-hint" data-en="This setting applies to the current local demo.">此设置作用于当前本地演示进程。</p>
      </div>
      <div id="live-settings" class="dialog-fields" hidden>
        <p class="field-title" data-en="Hub address">Hub 地址</p>
        <p id="hub-address" class="mono"></p>
        <p class="field-hint" data-en="Use the same reachable Hub address in the browser and in the Node app on other devices.">同网设备上的 Node 和浏览器请使用同一个可达的 Hub 地址。</p>
        <label for="token" class="field-title" data-en="User token (DEMO_TOKEN)">用户令牌（DEMO_TOKEN）</label>
        <input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="输入演示令牌" data-en-placeholder="Enter your demo token">
        <p class="field-hint" data-en="Use the token issued by the Hub. Enter it again after refreshing, or configure it as an environment variable.">使用 Hub 分配的用户令牌。页面刷新后需重新输入，部署也可通过环境变量提供令牌。</p>
      </div>
      <p id="settings-error" class="notice error" role="alert" hidden></p>
      <div class="dialog-footer"><button id="save-settings" class="button primary" type="submit" data-en="Apply settings">应用设置</button></div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
