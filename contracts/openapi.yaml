openapi: 3.1.0
info:
  title: D题多设备任务平台：P1资源执行 + P2任务调度
  version: 0.2.0
  description: 待实现契约，替代0.1.0。用户选择类型并提供文件。字段之外语义必须同时遵守05-接口契约与联调手册.md。示例全合成，非实测。
tags:
- name: P1
  description: P1资源接入、文件、能力准备、单次执行；不做Job或跨节点重试。
- name: P2
  description: P2用户Job、拆分、节点选择、业务重试和汇总；不执行模型。
paths:
  /api/resource/v1/healthz:
    servers:
    - url: http://localhost:8001
      description: P1 开发占位；替换为可访问地址。
    get:
      tags:
      - P1
      operationId: p1Health
      summary: P1服务及契约版本
      x-owner: P1
      description: P1服务及契约版本
      security: []
      responses:
        '200':
          description: 成功；不表示独立业务质量已经合格。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          description: 服务内部错误；写请求的接纳结果未知，保留原ID对账，不另开一单。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/resource/v1/resources:
    servers:
    - url: http://localhost:8001
