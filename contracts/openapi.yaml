      additionalProperties: false
      description: 发布的单profile锁文件。故意不含profile_digest：该摘要计算整个锁文件原始字节后，在外部目录/请求中记录。模型实际验证仍需人工及设备证据。
    ProfileDraft:
      type: object
      properties:
        task_type:
          type: string
          enum:
          - ocr.image.v1
          - asr.file.v1
        profile_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$
        configuration_state:
          type: string
          const: UNCONFIGURED
        profile_digest:
          type: 'null'
        model_id:
          anyOf:
          - type: string
          - type: 'null'
        model_source:
          anyOf:
          - type: string
          - type: 'null'
        model_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        weights_license_verified:
          type: boolean
        dependencies:
          type: object
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
        preprocessing:
          anyOf:
          - type: string
          - type: 'null'
        postprocessing:
          anyOf:
          - type: string
          - type: 'null'
        minimum_ram_bytes:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        supported_languages:
          type: array
          items:
            type: string
            enum:
            - auto
            - zh
            - en
          minItems: 1
          uniqueItems: true
        verified_devices:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,80}$
        frozen_at:
          anyOf:
          - type: string
            format: date-time
            pattern: Z$
          - type: 'null'
      required:
      - task_type
      - profile_id
      - configuration_state
      - profile_digest
      - model_id
      - model_source
      - model_sha256
      - weights_license_verified
      - dependencies
      - preprocessing
      - postprocessing
      - minimum_ram_bytes
      - supported_languages
      - verified_devices
      - frozen_at
      additionalProperties: false
    RuntimeManifestTemplate:
      type: object
      properties:
        contract_version:
          type: string
          const: 0.2.0
        status:
          type: string
          const: UNVERIFIED_TEMPLATE
        note:
          type: string
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileDraft'
          minItems: 2
          maxItems: 2
      required:
      - contract_version
      - status
      - note
      - profiles
      additionalProperties: false
