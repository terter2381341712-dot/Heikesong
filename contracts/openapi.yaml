components:
  securitySchemes:
    DemoToken:
      type: http
      scheme: bearer
      description: 用户/前端/验收：DEMO_TOKEN。禁止调用准备和执行接口。
    TaskToken:
      type: http
      scheme: bearer
      description: P2服务端/验收：TASK_TOKEN。不得给浏览器。
  schemas:
    Health:
      type: object
      properties:
        service:
          type: string
          enum:
          - p1_resource
          - p2_task
        contract_version:
          type: string
          const: 0.2.0
        status:
          type: string
          const: ok
        server_time:
          type: string
          format: date-time
          pattern: Z$
      required:
      - service
      - contract_version
      - status
      - server_time
      additionalProperties: false
    Error:
      type: object
      properties:
        code:
          type: string
          enum:
          - UNAUTHORIZED
          - FORBIDDEN
          - INVALID_REQUEST
          - INPUT_INVALID
          - INPUT_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - UNSUPPORTED_TASK_TYPE
          - PARAMETER_UNSUPPORTED
          - NOT_FOUND
          - IDEMPOTENCY_CONFLICT
          - RESOURCE_BUSY
          - NODE_UNAVAILABLE
          - SESSION_CHANGED
          - CAPABILITY_NOT_READY
          - PROFILE_MISMATCH
          - PROFILE_UNCONFIGURED
          - DEPENDENCY_UNAVAILABLE
          - NODE_OFFLINE
          - LEASE_EXPIRED
          - EXECUTION_TIMEOUT
          - EXECUTION_ERROR
          - RESULT_INVALID
          - RESOURCE_SERVICE_RESTARTED
          - MODEL_LOAD_FAILED
          - MODEL_DOWNLOAD_FAILED
          - MODEL_HASH_MISMATCH
          - PREPARATION_TIMEOUT
          - JOB_NOT_TERMINAL
          - STALE_EXECUTION
          - INTERNAL_ERROR
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        request_id:
          type: string
          format: uuid
        details:
          type: object
          properties:
            execution_id:
              type: string
              format: uuid
            preparation_id:
              type: string
              format: uuid
            artifact_id:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,80}$
            job_id:
              type: string
              format: uuid
            retry_after_seconds:
              type: integer
              minimum: 1
            field:
              type: string
          required: []
          additionalProperties: false
      required:
      - code
      - message
      - retryable
      - request_id
      - details
      additionalProperties: false
    TaskParameters:
      type: object
      properties:
        language:
          type: string
          enum:
          - auto
          - zh
          - en
      required:
      - language
      additionalProperties: false
    TaskTypeDescriptor:
      type: object
      properties:
        task_type:
          type: string
          enum:
          - ocr.image.v1
          - asr.file.v1
        display_name:
          type: string
          minLength: 1
        profile_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$
        profile_digest:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        configuration_state:
          type: string
          enum:
          - UNCONFIGURED
          - CONFIGURED
        supported_languages:
          type: array
          items:
            type: string
            enum:
            - auto
            - zh
            - en
          minItems: 1
          uniqueItems: true
        input_mime_types:
          type: array
          items:
            type: string
            enum:
            - image/jpeg
            - image/png
            - audio/wav
          minItems: 1
          uniqueItems: true
        max_file_bytes:
          type: integer
          minimum: 1
        max_pixels:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        max_duration_ms:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        max_inputs_per_job:
          type: integer
          const: 200
        split_unit:
          type: string
          const: input_file
        result_schema:
          type: string
          enum:
          - OCRResult
          - ASRResult
        default_timeout_seconds:
          type: integer
          minimum: 10
          maximum: 600
        reason:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - task_type
      - display_name
      - profile_id
      - profile_digest
      - configuration_state
      - supported_languages
      - input_mime_types
      - max_file_bytes
      - max_pixels
      - max_duration_ms
      - max_inputs_per_job
      - split_unit
      - result_schema
      - default_timeout_seconds
      - reason
      additionalProperties: false
    TypeCatalog:
      type: object
      properties:
        contract_version:
          type: string
          const: 0.2.0
        server_time:
          type: string
          format: date-time
          pattern: Z$
        task_types:
          type: array
          items:
            $ref: '#/components/schemas/TaskTypeDescriptor'
      required:
      - contract_version
      - server_time
      - task_types
      additionalProperties: false
    TypeCatalogFile:
      type: object
      properties:
        contract_version:
          type: string
          const: 0.2.0
        status:
          type: string
          const: DESIGN_ONLY
        note:
          type: string
        task_types:
          type: array
          items:
            $ref: '#/components/schemas/TaskTypeDescriptor'
          minItems: 2
          maxItems: 2
      required:
      - contract_version
      - status
      - note
      - task_types
      additionalProperties: false
    MediaInfo:
      type: object
      properties:
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        sample_rate_hz:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        channels:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        audio_encoding:
          anyOf:
          - type: string
            enum:
            - PCM_S16LE
          - type: 'null'
      required:
      - width
      - height
      - duration_ms
      - sample_rate_hz
      - channels
      - audio_encoding
      additionalProperties: false
    Artifact:
      type: object
      properties:
        artifact_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
        kind:
          type: string
          enum:
          - INPUT
          - RESULT
        original_name:
          type: string
          minLength: 1
          maxLength: 255
        content_type:
          type: string
          enum:
          - image/jpeg
          - image/png
          - audio/wav
          - application/json
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
          minimum: 1
        media_info:
          $ref: '#/components/schemas/MediaInfo'
        download_path:
          type: string
          pattern: ^/api/resource/v1/artifacts/[A-Za-z0-9_-]+/content$
        created_at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - artifact_id
      - kind
      - original_name
      - content_type
      - sha256
      - size_bytes
      - media_info
      - download_path
      - created_at
      additionalProperties: false
    UploadRequest:
      type: object
      properties:
        upload_id:
          type: string
          format: uuid
        file:
          type: string
          format: binary
      required:
      - upload_id
      - file
      additionalProperties: false
    Hardware:
      type: object
      properties:
        os:
          type: string
        arch:
          type: string
        cpu_name:
          anyOf:
          - type: string
          - type: 'null'
        logical_cores:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        ram_total_bytes:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        ram_available_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        gpu_name:
          anyOf:
          - type: string
          - type: 'null'
        gpu_vram_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        gpu_info_source:
          type: string
          enum:
          - detected
          - unavailable
        manual_labels:
          type: object
          additionalProperties:
            type: string
        detection_errors:
          type: array
          items:
            type: string
      required:
      - os
      - arch
      - cpu_name
      - logical_cores
      - ram_total_bytes
      - ram_available_bytes
      - gpu_name
      - gpu_vram_bytes
      - gpu_info_source
      - manual_labels
      - detection_errors
      additionalProperties: false
    Calibration:
      type: object
      properties:
        sample_count:
          type: integer
          minimum: 1
        median_compute_ms:
          type: number
          exclusiveMinimum: 0
        passed:
          type: boolean
        finished_at:
          type: string
          format: date-time
          pattern: Z$
      required:
      - sample_count
      - median_compute_ms
      - passed
      - finished_at
      additionalProperties: false
    Capability:
      type: object
      properties:
        task_type:
          type: string
          enum:
          - ocr.image.v1
          - asr.file.v1
        profile_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}$
        profile_digest:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        state:
          type: string
          enum:
          - UNAVAILABLE
          - NOT_PREPARED
          - PREPARING
          - READY
          - ERROR
        model_cached:
          type: boolean
        backend:
          anyOf:
          - type: string
            enum:
            - cpu
            - cuda
          - type: 'null'
        runtime_provider:
          anyOf:
          - type: string
          - type: 'null'
        model_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        verified:
          type: boolean
        calibration:
          anyOf:
          - $ref: '#/components/schemas/Calibration'
          - type: 'null'
        reason:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - task_type
      - profile_id
      - profile_digest
      - state
      - model_cached
      - backend
      - runtime_provider
      - model_sha256
      - verified
      - calibration
      - reason
      additionalProperties: false
    Telemetry:
      type: object
      properties:
        sampled_at:
          type: string
          format: date-time
          pattern: Z$
        cpu_percent:
          anyOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        ram_used_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        gpu_percent:
          anyOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        gpu_memory_used_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        gpu_metric_source:
          type: string
          enum:
          - nvidia-smi
          - unavailable
      required:
      - sampled_at
      - cpu_percent
      - ram_used_bytes
      - gpu_percent
      - gpu_memory_used_bytes
      - gpu_metric_source
      additionalProperties: false
    ResourceNode:
      type: object
      properties:
        worker_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,80}$
        session_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        connection:
          type: string
          enum:
          - ONLINE
          - OFFLINE
        mode:
          type: string
          enum:
          - ACTIVE
          - DRAINING
          - PAUSED
        hardware:
          $ref: '#/components/schemas/Hardware'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        max_slots:
          type: integer
          const: 1
        reserved_slots:
          type: integer
          minimum: 0
          maximum: 1
        available_slots:
          type: integer
