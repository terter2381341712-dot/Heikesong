openapi: 3.1.0
info:
  title: Elastic Product Image Workshop — D Track Team Contract
  version: 0.1.0
  description: D题团队自定义的最小HTTP契约，不是C题冻结API，也不表示服务已实现。状态与竞态语义见架构说明。所有时间UTC；正式吞吐只计独立质量核验后的唯一任务。
servers:
- url: http://localhost:8000
  description: 占位地址，联调替换为协调机受控局域网地址。
paths:
  /healthz:
    get:
      operationId: healthz
      summary: 健康与契约版本
      security: []
      responses:
        '200':
          description: 服务可访问。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /v1/assets:
    post:
      operationId: uploadAsset
      summary: 上传单张图片并规范化
      security:
      - DemoToken: []
      description: 10 MiB / 2000 万像素以内的 JPG/PNG。纠正方向、透明区域白底合成、RGB、最长边 1024，保存规范化 PNG。内容
        SHA 与原文件 SHA 可不同；返回规范化输入 SHA。输入不会由模型预处理成答案。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
              additionalProperties: false
      responses:
        '201':
          description: 已保存规范化输入。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 文件或像素数量超限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 不支持的格式或文件解码失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/assets/{asset_id}:
    get:
      operationId: downloadAsset
      summary: 鉴权下载输入或结果
      security:
      - DemoToken: []
      - WorkerToken: []
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      description: DEMO_TOKEN 可读团队产物；Worker 仅可读其当前有效租约对应的输入。通过鉴权 fetch Blob 显示图片，不在
        URL 放令牌。
      responses:
        '200':
          description: 图像二进制。
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 角色、Worker 或会话权限不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs:
    post:
      operationId: createJob
      summary: 幂等创建图片处理批次
      security:
      - DemoToken: []
      description: 一个 input_id 对应一个逻辑任务。同一个 Job 中不能有重复规范化内容 SHA。同 client_request_id
        同载荷返回同一 job_id；不同载荷返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '200':
          description: 同请求的幂等重放，duplicate=true。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        '201':
          description: 首次创建。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 流水线配置未就绪。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: 查询状态、全部任务与尝试记录
      security:
      - DemoToken: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      description: 此处 succeeded 表示执行及格式校验通过，不等于人工质量已合格。计数按唯一 task_id；不暴露 lease_token
        或节点令牌。
      responses:
        '200':
          description: 完整任务快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/jobs/{job_id}/download:
    get:
      operationId: downloadJob
      summary: 下载终态素材包和失败清单
      security:
      - DemoToken: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      description: 终态均允许下载。每个成功 task_id 一个目录、三种文件；manifest.json 包含原始名称、设备、任务与失败原因。未结束返回
        409 JOB_NOT_TERMINAL。
      responses:
        '200':
          description: ZIP，不把失败任务静默隐藏。
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/pool:
    get:
      operationId: getPool
      summary: 节点、配置、采样和最近事件
      security:
      - DemoToken: []
      description: 节点数量不硬编码。已接受结果数不是质量核验后吞吐；正式 qualified 数由独立验收报告给出。
      responses:
        '200':
          description: 实时快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolView'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workers/register:
    post:
      operationId: registerWorker
      summary: 注册或重放 Worker 启动会话
      security:
      - JoinToken: []
      description: 同 installation_id/instance_id 重试返回同一会话与凭证。新 instance_id 撤销该安装旧会话和旧租约；初始
        WARMING。pipeline=null 时不得 READY。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerRegistrationRequest'
      responses:
        '200':
          description: 同实例注册重放。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistrationResponse'
        '201':
          description: 创建新会话。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerRegistrationResponse'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workers/{worker_id}/heartbeat:
    post:
      operationId: heartbeatWorker
      summary: 报告阶段与采样，续租并对账
      security:
      - WorkerToken: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
      description: 每 3 秒。仅当前有效 active_attempts 可续租至 min(服务时间+15秒,硬截止)。READY 须能力匹配且3张校准通过。返回服务器活动租约使领取响应丢失可恢复；离线/超时旧尝试不可借心跳复活。
      responses:
        '200':
          description: 控制模式与租约对账。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 角色、Worker 或会话权限不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workers/{worker_id}/claim:
    post:
      operationId: claimTask
      summary: 原子领取一张兼容任务
      security:
      - WorkerToken: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      description: 在线、ACTIVE、READY、模型一致、空槽位才可首次领取。相同 claim_request_id 返回原租约，即使槽位已占用；若原尝试已撤销/结束则409。没有工作返回204且不持久化该请求为终态；新请求已有占用返回409
        WORKER_BUSY。默认轮询间隔1秒。
      responses:
        '200':
          description: 当前尝试的完整租约。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskLease'
        '204':
          description: 没有可用的兼容待办任务，无响应体。
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 角色、Worker 或会话权限不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/workers/{worker_id}/mode:
    post:
      operationId: setWorkerMode
      summary: 正常退出或恢复接任务
      security:
      - DemoToken: []
      - WorkerToken: []
      parameters:
      - name: worker_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModeRequest'
      description: WorkerToken 只可控制自己。DRAINING 立即停止新领取，当前尝试保留续租，空闲后PAUSED。ACTIVE 恢复须满足就绪/在线条件；不能借此把离线设备假装在线。
      responses:
        '200':
          description: 最新 Worker 状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerView'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 角色、Worker 或会话权限不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{task_id}/complete:
    post:
      operationId: completeTask
      summary: 提交当前租约产物并幂等接纳
      security:
      - WorkerToken: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      description: meta 是 CompletionMeta 的 JSON 字符串；服务器必须解析并校验。当前会话、attempt、lease、硬期限和模型均需匹配。相同
        submission_id 与内容重传返回相同已接纳结果；修改内容或过期尝试409。结果不是由客户端自己宣布成功。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                meta:
                  type: string
                  description: JSON 序列化的 CompletionMeta。
                  contentMediaType: application/json
                  x-json-schema:
                    $ref: '#/components/schemas/CompletionMeta'
                cutout:
                  type: string
                  format: binary
                white:
                  type: string
                  format: binary
                thumbnail:
                  type: string
                  format: binary
              required:
              - meta
              - cutout
              - white
              - thumbnail
              additionalProperties: false
            encoding:
              meta:
                contentType: application/json
              cutout:
                contentType: image/png
              white:
                contentType: image/jpeg
              thumbnail:
                contentType: image/webp
      responses:
        '200':
          description: 首次或幂等接纳。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionAck'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 角色、Worker 或会话权限不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 文件或像素数量超限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 不支持的格式或文件解码失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/tasks/{task_id}/fail:
    post:
      operationId: failTask
      summary: 报告当前尝试失败
      security:
      - WorkerToken: []
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,100}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailureRequest'
      description: 校验当前租约。是否重试由服务端错误分类和最多3次尝试限制决定。可重试任务重新排队、对本节点冷却10秒；不可重试终止。相同已记录失败的重传返回原确认，不再次增加尝试或重排。
      responses:
        '200':
          description: 重排或终止确认。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureAck'
        '401':
          description: 缺少或无效令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 角色、Worker 或会话权限不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 资源不存在。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等载荷冲突、STALE_ATTEMPT、会话/状态冲突或尚未结束。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 字段、流水线、图片或结果校验失败。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    DemoToken:
      type: http
      scheme: bearer
      description: 用户网页、压测与控制端令牌，环境变量DEMO_TOKEN。
    JoinToken:
      type: http
      scheme: bearer
      description: 只有注册使用的加入令牌JOIN_TOKEN。
    WorkerToken:
      type: http
      scheme: bearer
      description: 注册返回的会话级Worker令牌；只允许自身节点与租约。
  schemas:
    Identifier:
      type: string
      pattern: ^[A-Za-z0-9_-]{1,100}$
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
      required:
      - code
      - message
      - retryable
      additionalProperties: false
    Hardware:
      type: object
      properties:
        os:
          type: string
        arch:
          type: string
        cpu_name:
          anyOf:
          - type: string
          - type: 'null'
        logical_cores:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        ram_total_bytes:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        ram_available_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        gpu_name:
          anyOf:
          - type: string
          - type: 'null'
        gpu_vram_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        gpu_info_source:
          type: string
          enum:
          - detected
          - unavailable
        manual_labels:
          type: object
          additionalProperties:
            type: string
          description: 只用于显示，不授予能力或改变后端。
        detection_errors:
          type: array
          items:
            type: string
      required:
      - os
      - arch
      - cpu_name
      - logical_cores
      - ram_total_bytes
      - ram_available_bytes
      - gpu_name
      - gpu_vram_bytes
      - gpu_info_source
      - manual_labels
      - detection_errors
      additionalProperties: false
    Capabilities:
      type: object
      properties:
        pipeline_id:
          type: string
          enum:
          - product_image_v1
        model_id:
          type: string
          enum:
          - u2net
          - u2netp
        model_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        backend:
          type: string
          enum:
          - cpu
          - cuda
        runtime_provider:
          type: string
          enum:
          - CPUExecutionProvider
          - CUDAExecutionProvider
        available_providers:
          type: array
          items:
            type: string
        concurrency:
          type: integer
          const: 1
        cpu_threads:
          type: integer
          minimum: 1
          maximum: 4
